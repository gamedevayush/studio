ba(255,255,255,.3)}#confetti{position:fixed;inset:0;z-index:2800;pointer-events:none}@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}}@keyframes fadeIn{from{opacity:0}}@keyframes dropIn{from{opacity:0;transform:translateY(-24px)}}#hostCtl{--tx:-50%}@keyframes sheetIn{from{transform:translateY(110%)}}@keyframes cardIn{from{opacity:0;transform:translateX(40px) scale(.97)}}@keyframes plIn{from{opacity:0}}@keyframes bob{50%{transform:translateY(-6px)}}@keyframes ring{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.35);opacity:0}}@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.8);opacity:0}}@keyframes pop{from{transform:scale(0)}}@keyframes flagDrop{from{transform:translateY(-40px) scale(.4) rotate(-20deg);opacity:0}}@keyframes sheen{to{background-position:-200% 0}}@keyframes shine{100%,60%{transform:translateX(100%)}}@keyframes rot{to{transform:rotate(360deg)}}@keyframes ping{70%{box-shadow:0 0 0 9px rgba(250,204,21,0)}100%{box-shadow:0 0 0 0 rgba(250,204,21,0)}}@keyframes pingG{0%{box-shadow:0 0 0 0 rgba(74,222,128,.7)}70%{box-shadow:0 0 0 9px rgba(74,222,128,0)}100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}}@keyframes blink{50%{opacity:.45}}@keyframes dash{to{stroke-dashoffset:-14}}@keyframes countIn{0%{transform:scale(2.2);opacity:0;filter:blur(20px)}40%{transform:scale(1);opacity:1;filter:blur(0)}100%{transform:scale(.7);opacity:0}}@keyframes toastIn{from{opacity:0;transform:translateY(-20px) scale(.9)}}@keyframes toastOut{to{opacity:0;transform:translateY(-12px) scale(.95)}}@media (prefers-reduced-motion:reduce){*,::after,::before{animation-duration:NaNs!important;animation-iteration-count:1!important;transition-duration:NaNs!important}}</style></head><body><div class="aurora"><i></i><i></i><i></i></div><div class="grain"></div><div id="lobby"><div class="wrap" style="width:100%"><nav class="nav glass"><a class="brand" href="../../"><span class="logo"><svg viewBox="0 0 16 16"><path d="M8 1l6 7-6 7-6-7z" fill="#fff"/></svg></span>Ayush Studio</a><div class="nav-links"><a href="../../#tools">Tools</a> <a href="https://gamedevayush.github.io/aboutme/" target="_blank" rel="noopener">About</a></div></nav></div><div class="lobby-main wrap" style="width:100%"><div class="card glass"><div class="hero-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div><h1>Live <span class="grad-text">Race</span></h1><p class="sub">Create a room, invite friends — see everyone live, or race to a finish line.</p><label class="field"><input id="name" placeholder="Your name" maxlength="20" autocomplete="nickname"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></label> <button class="big primary" id="createBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>Create a room</span></button><div class="or">or join one</div><label class="field"><input id="codeIn" placeholder="Room code" maxlength="5" autocomplete="off"> <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg></label> <button class="big" id="joinBtn"><span>Join room</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button><div class="feats"><span>📍 Live location</span><span>🏁 Race mode</span><span>🔒 No sign-up</span></div></div></div></div><div id="app"><div id="map"></div><div id="top"><a class="chip gl back" href="./" title="Leave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke
