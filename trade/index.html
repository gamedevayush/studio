<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0e13">
  <title>Lets Trade</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2311151c'/%3E%3Cpath d='M11 6v4M11 22v4M21 9v3M21 20v4' stroke='%23f0a92e' stroke-width='2' stroke-linecap='round'/%3E%3Crect x='8' y='10' width='6' height='12' rx='1.5' fill='%23f0a92e'/%3E%3Crect x='18' y='12' width='6' height='8' rx='1.5' fill='none' stroke='%23f0a92e' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main id="lock" class="lock" hidden>
    <form class="lock-card" id="lock-form" autocomplete="on">
      <div class="brand brand-lg"><span class="logo" aria-hidden="true"></span><span>Lets Trade</span></div>
      <p class="lock-sub">Private desk. Password daalo.</p>
      <input type="text" name="username" value="ayush" autocomplete="username" hidden>
      <label class="field">
        <span>Password</span>
        <input id="pw" type="password" autocomplete="current-password" required autofocus>
      </label>
      <label class="check"><input id="remember" type="checkbox" checked> Is device pe yaad rakho</label>
      <button class="btn btn-primary" id="unlock" type="submit">Open</button>
      <p class="lock-err" id="lock-err" role="alert"></p>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <aside class="side" id="side"></aside>
    <header class="top">
      <a class="brand" href="#/"><span class="logo" aria-hidden="true"></span><span>Lets Trade</span></a>
      <button class="icon-btn" data-action="lock" aria-label="Lock"></button>
    </header>
    <section class="view" id="view" tabindex="-1"></section>
    <nav class="dock" id="dock" aria-label="Main"></nav>
    <div class="sheet" id="sheet" hidden></div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
